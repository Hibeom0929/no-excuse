<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>No Excuse · 출석 및 벌금 관리</title>
    <meta name="theme-color" content="#1F3D2B" />
    <meta name="description" content="No Excuse — 친구들과 함께하는 출석 및 벌금 관리" />

    <!-- 홈 화면에 추가했을 때 쓰일 아이콘 (iOS는 manifest보다 이 태그를 우선 읽어요) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- 홈 화면에 추가해서 실행했을 때 브라우저 주소창을 숨기고 앱처럼 보이게 함 (iOS Safari 전용 설정) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="No Excuse" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
